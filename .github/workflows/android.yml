# يبني ملف APK تجريبيًا (debug) لنظام Android عند كل دفع إلى GitHub، ويرفعه كملف قابل للتنزيل.
# لا يحتاج أي أسرار؛ نسخة النشر في Google Play تحتاج مفتاح توقيع يُضاف لاحقًا كسرّ في المستودع.
name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
