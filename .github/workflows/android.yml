# يبني ملف APK تجريبيًا (debug) لنظام Android عند كل دفع إلى GitHub، ويرفعه كملف قابل للتنزيل.
# لا يحتاج أي أسرار؛ نسخة النشر في Google Play تحتاج مفتاح توقيع يُضاف لاحقًا كسرّ في المستودع.
name: Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'نشر نسخة معاينة (Pre-release) علنية من هذا الفرع'
        type: boolean
        default: false
      publish_tv_page:
        description: 'نشر شاشة التلفاز كصفحة ويب (لتلفاز سامسونج من المتصفح) في الفرع tv-page'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # شاشة التلفاز كصفحة ويب لمتصفح تلفاز سامسونج (Internet): تُنشر فقط بتشغيل يدوي يطلبها صراحة.
  # بعد أول نشر: Settings ← Pages ← Deploy from a branch ← tv-page ← (root) ← Save
  tv-page:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_tv_page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tv
      - run: touch dist-tv/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: tv-page
          publish_dir: ./dist-tv
          force_orphan: true
          commit_message: شاشة رفيق المسلم للتلفاز (صفحة ويب)

  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_tv_page || inputs.publish_beta
    runs-on: ubuntu-latest
    # النسخ العامة: مزايا بلس مقفلة، ولا متجر اختبار، ولا اشتراك حتى يُربط المتجر الحقيقي (VITE_RC_ANDROID_KEY).
    # المعاينة الخاصة بصاحب التطبيق تُبنى في آخر هذه المهمة وتُرفع كملف بناء فقط، ولا تُرفق بأي إصدار.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # مفتاح توقيع ثابت للنسخ التجريبية: يُولَّد مرة ويُحفظ في ذاكرة البناء المؤقتة ويُعاد استخدامه،
      # فتُثبَّت كل نسخة جديدة فوق السابقة دون حذفها (للهاتف والتلفاز). ليس سرًا: مفتاح تطوير فقط.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Hisn al-Muslim notification sounds
        run: bash scripts/fetch-hisn-sounds.sh
      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee phone-build.log || { grep -E "error:|FAILED|Exception" phone-build.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # تطبيق شاشة التلفاز (Android TV) — مستقل عن تطبيق الهاتف
      - run: npm run build:tv && npm run tv:assets && npm run tv:tizen
      - name: Build Android TV APK
        working-directory: android-tv
        # أخطاء الترجمة والاختبارات تظهر كملاحظات في صفحة التشغيل
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug 2>&1 | tee tv-build.log || { grep -E "error:|FAILED|Exception|expected" tv-build.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-tv-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
      # على الفرع الرئيسي فقط: يُنشر الملف كإصدار (Release) برابط ثابت:
      # https://github.com/<المالك>/<المستودع>/releases/latest/download/RafiqAlMuslim.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk RafiqAlMuslim.apk
          gh release create "v$VERSION-build.${{ github.run_number }}" RafiqAlMuslim.apk \
            --target "${{ github.sha }}" --latest \
            --title "رفيق المسلم $VERSION (تجريبي ${{ github.run_number }})" \
            --notes "نسخة تجريبية لنظام Android. نزّل RafiqAlMuslim.apk وثبّته (اسمح بالتثبيت من مصادر غير معروفة). مجاني بالكامل — صدقة جارية."
      # فروع التطوير: نسخة تجريبية (Pre-release) للمعاينة دون المساس بالإصدار الرئيسي
      - name: Publish beta pre-release
        # لا تُنشر ملفات علنية تلقائيًا: نسخة المعاينة تُنشر فقط بتشغيل يدوي يطلبها صراحة
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta && startsWith(github.ref, 'refs/heads/feature/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk RafiqAlMuslimPlus-beta.apk
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk RafiqAlMuslim-TV.apk
          cp dist-tizen/RafiqAlMuslim-Samsung.wgt RafiqAlMuslim-Samsung.wgt
          cp scripts/samsung/install-samsung.bat install-samsung.bat
          gh release create "beta-v$VERSION-build.${{ github.run_number }}" RafiqAlMuslimPlus-beta.apk RafiqAlMuslim-TV.apk RafiqAlMuslim-Samsung.wgt install-samsung.bat \
            --target "${{ github.sha }}" --prerelease \
            --title "رفيق المسلم $VERSION — نسخة معاينة (${{ github.ref_name }})" \
            --notes "نسخة معاينة من فرع التطوير. للهاتف (رفيق المسلم بلس — يُثبَّت بجانب التطبيق المجاني؛ مزايا بلس والاشتراك غير مفعّلة بعد في هذه النسخة): RafiqAlMuslimPlus-beta.apk. لشاشة التلفاز بنظام Android TV: RafiqAlMuslim-TV.apk. لتلفاز Samsung (Tizen): RafiqAlMuslim-Samsung.wgt مع install-samsung.bat للتثبيت من حاسوب Windows عليه Tizen Studio. القرآن والأذكار والأدعية والمواقيت مجانية دائمًا — صدقة جارية."
      # المعاينة الخاصة بصاحب التطبيق (فروع التطوير فقط): كل مزايا بلس مفتوحة مع متجر الاختبار بلا دفع.
      # تُبنى بعد نسخ الملفات العامة حتى لا تختلط بها، وتُرفع كملف بناء لمدة 14 يومًا، ولا تُرفق بأي إصدار.
      - name: Build private preview APK
        if: startsWith(github.ref, 'refs/heads/feature/')
        env:
          VITE_PLUS_UNLOCK: '1'
          VITE_BILLING_SANDBOX: '1'
        run: |
          npm run build
          npx cap sync android
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">بلس — معاينة خاصة</string>|' android/app/src/main/res/values/strings.xml
          cd android
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee preview-build.log || { grep -E "error:|FAILED|Exception" preview-build.log | head -20 | sed 's/^/::error::/'; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk ../RafiqPlus-PRIVATE-preview.apk
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/feature/')
        with:
          name: rafiq-plus-PRIVATE-preview
          path: RafiqPlus-PRIVATE-preview.apk
          retention-days: 14
