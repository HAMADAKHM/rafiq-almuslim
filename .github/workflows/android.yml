# يبني ملف APK تجريبيًا (debug) لنظام Android عند كل دفع إلى GitHub، ويرفعه كملف قابل للتنزيل.
# لا يحتاج أي أسرار؛ نسخة النشر في Google Play تحتاج مفتاح توقيع يُضاف لاحقًا كسرّ في المستودع.
name: Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'نشر نسخة معاينة (Pre-release) علنية من هذا الفرع'
        type: boolean
        default: false
      publish_tv_page:
        description: 'نشر شاشة التلفاز كصفحة ويب (لتلفاز سامسونج من المتصفح) في الفرع tv-page'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # شاشة التلفاز كصفحة ويب لمتصفح تلفاز سامسونج (Internet): تُنشر فقط بتشغيل يدوي يطلبها صراحة.
  # بعد أول نشر: Settings ← Pages ← Deploy from a branch ← tv-page ← (root) ← Save
  tv-page:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_tv_page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tv
      - run: touch dist-tv/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: tv-page
          publish_dir: ./dist-tv
          force_orphan: true
          commit_message: شاشة رفيق المسلم للتلفاز (صفحة ويب)

  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_tv_page || inputs.publish_beta
    runs-on: ubuntu-latest
    env:
      # بقرار صاحب التطبيق: مزايا بلس مفتوحة للجميع مؤقتًا دون اشتراك، وتُقفل لاحقًا بحذف هذا السطر.
      # لا متجر اختبار ولا دفع في النسخ العامة.
      VITE_PLUS_UNLOCK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # مفتاح توقيع ثابت للنسخ التجريبية: يُولَّد مرة ويُحفظ في ذاكرة البناء المؤقتة ويُعاد استخدامه،
      # فتُثبَّت كل نسخة جديدة فوق السابقة دون حذفها (للهاتف والتلفاز). ليس سرًا: مفتاح تطوير فقط.
      # الإصدار السابق من هذه الخطوة كان يولّد مفتاحًا جديدًا في كل بناء (لم يُحفظ المفتاح)، فرفض Android
      # تثبيت التحديث فوق النسخة السابقة. الآن: يُستعاد أحدث مفتاح محفوظ، وإن لم يوجد يُولَّد مرة ويُحفظ فورًا.
      - name: Restore stable debug signing key
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v2-${{ github.run_id }}
          restore-keys: android-debug-keystore-v2-
      - name: Create debug signing key (first build only)
        if: steps.keystore.outputs.cache-matched-key == ''
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Save debug signing key
        if: steps.keystore.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v2-${{ github.run_id }}
      - name: Signing key fingerprint
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 "SHA256:"
      - run: npm ci
      - run: npm test
        env:
          # الاختبارات تفحص القفل الحقيقي دائمًا
          VITE_PLUS_UNLOCK: "0"
      - run: npm run build
      - run: npx cap sync android
      - name: Hisn al-Muslim notification sounds
        run: bash scripts/fetch-hisn-sounds.sh
      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee phone-build.log || { grep -E "error:|FAILED|Exception" phone-build.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # تطبيق شاشة التلفاز (Android TV) — مستقل عن تطبيق الهاتف
      - run: npm run build:tv && npm run tv:assets && npm run tv:tizen
      - name: Build Android TV APK
        working-directory: android-tv
        # أخطاء الترجمة والاختبارات تظهر كملاحظات في صفحة التشغيل
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug 2>&1 | tee tv-build.log || { grep -E "error:|FAILED|Exception|expected" tv-build.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-tv-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
      # على الفرع الرئيسي فقط: يُنشر الملف كإصدار (Release) برابط ثابت:
      # https://github.com/<المالك>/<المستودع>/releases/latest/download/RafiqAlMuslim.apk
      # معطّل في فرع النسخة الجديدة: الرابط الثابت releases/latest/download/RafiqAlMuslim.apk يخص
      # النسخة الأصلية، ولا يجوز أن تنشر فوقه النسخة الجديدة حتى لو دُمج هذا الفرع بالخطأ.
      - name: Publish release
        if: false && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk RafiqAlMuslim.apk
          gh release create "v$VERSION-build.${{ github.run_number }}" RafiqAlMuslim.apk \
            --target "${{ github.sha }}" --latest \
            --title "رفيق المسلم $VERSION (تجريبي ${{ github.run_number }})" \
            --notes "نسخة تجريبية لنظام Android. نزّل RafiqAlMuslim.apk وثبّته (اسمح بالتثبيت من مصادر غير معروفة). مجاني بالكامل — صدقة جارية."
      # النسخة الجديدة المستقلة (رفيق المسلم الجديد): معرفات تطبيق وأسماء ملفات ووسوم مختلفة كليًا
      # عن النسخ الأصلية، فلا يلتقطها تحديث النسخ الأصلية ولا تحل محل روابطها. تُنشر يدويًا فقط.
      - name: Publish New edition pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta && startsWith(github.ref, 'refs/heads/feature/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk RafiqAlMuslimNew.apk
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk RafiqAlMuslimTVNew.apk
          gh release create "new-v$VERSION-build.${{ github.run_number }}" RafiqAlMuslimNew.apk RafiqAlMuslimTVNew.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "رفيق المسلم الجديد $VERSION — نسخة معاينة (${{ github.ref_name }})" \
            --notes "النسخة الجديدة المستقلة — تُثبَّت بجانب النسخ الأصلية دون أن تمسها (معرّف مختلف وبيانات منفصلة). للهاتف: RafiqAlMuslimNew.apk. لشاشة Android TV: RafiqAlMuslimTVNew.apk. لا دفع حقيقي في هذه النسخة."
