# يبني ملف APK تجريبيًا (debug) لنظام Android عند كل دفع إلى GitHub، ويرفعه كملف قابل للتنزيل.
# لا يحتاج أي أسرار؛ نسخة النشر في Google Play تحتاج مفتاح توقيع يُضاف لاحقًا كسرّ في المستودع.
name: Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'نشر نسخة معاينة (Pre-release) علنية من هذا الفرع'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # مفتاح توقيع ثابت للنسخ التجريبية: يُولَّد مرة ويُحفظ في ذاكرة البناء المؤقتة ويُعاد استخدامه،
      # فتُثبَّت كل نسخة جديدة فوق السابقة دون حذفها (للهاتف والتلفاز). ليس سرًا: مفتاح تطوير فقط.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # تطبيق شاشة التلفاز (Android TV) — مستقل عن تطبيق الهاتف
      - run: npm run build:tv && npm run tv:assets && npm run tv:tizen
      - name: Build Android TV APK
        working-directory: android-tv
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-tv-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
      # على الفرع الرئيسي فقط: يُنشر الملف كإصدار (Release) برابط ثابت:
      # https://github.com/<المالك>/<المستودع>/releases/latest/download/RafiqAlMuslim.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk RafiqAlMuslim.apk
          gh release create "v$VERSION-build.${{ github.run_number }}" RafiqAlMuslim.apk \
            --target "${{ github.sha }}" --latest \
            --title "رفيق المسلم $VERSION (تجريبي ${{ github.run_number }})" \
            --notes "نسخة تجريبية لنظام Android. نزّل RafiqAlMuslim.apk وثبّته (اسمح بالتثبيت من مصادر غير معروفة). مجاني بالكامل — صدقة جارية."
      # فروع التطوير: نسخة تجريبية (Pre-release) للمعاينة دون المساس بالإصدار الرئيسي
      - name: Publish beta pre-release
        # لا تُنشر ملفات علنية تلقائيًا: نسخة المعاينة تُنشر فقط بتشغيل يدوي يطلبها صراحة
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta && startsWith(github.ref, 'refs/heads/feature/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk RafiqAlMuslim-beta.apk
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk RafiqAlMuslim-TV.apk
          cp dist-tizen/RafiqAlMuslim-Samsung.wgt RafiqAlMuslim-Samsung.wgt
          gh release create "beta-v$VERSION-build.${{ github.run_number }}" RafiqAlMuslim-beta.apk RafiqAlMuslim-TV.apk RafiqAlMuslim-Samsung.wgt \
            --target "${{ github.sha }}" --prerelease \
            --title "رفيق المسلم $VERSION — نسخة معاينة (${{ github.ref_name }})" \
            --notes "نسخة معاينة من فرع التطوير. للهاتف: RafiqAlMuslim-beta.apk. لشاشة التلفاز بنظام Android TV: RafiqAlMuslim-TV.apk. لتلفاز Samsung (Tizen، يُثبَّت من Tizen Studio): RafiqAlMuslim-Samsung.wgt. مجاني بالكامل — صدقة جارية."
