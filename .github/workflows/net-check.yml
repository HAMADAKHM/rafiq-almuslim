# فحص يدوي لمصادر خارجية (لا ينشر شيئًا): يطبع ما يجده كملاحظات تُقرأ عبر واجهة GitHub
name: net-check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/net-check.yml', 'scripts/hisn-audio-map.mjs']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts > /dev/null 2>&1 || npm install --ignore-scripts > /dev/null 2>&1
      - name: hisn-audio-map
        run: |
          npx --yes tsx scripts/hisn-audio-map.mjs > map.txt 2> err.txt || true
          echo "::notice::$(grep '^SUM ' map.txt) err=$(head -c 200 err.txt | tr -d ':\n')"
          echo "::notice::$(grep '^MAP ' map.txt | tr -d ':\"')"
          echo "::notice::$(grep '^NONE ' map.txt)"
          grep '^REVIEW ' map.txt | sed 's/^REVIEW //' | tr -d ':' | sed 's/ ¦ /\n/g' > rev.txt
          split -l 6 rev.txt part_
          for f in part_*; do echo "::notice::R $(tr '\n' '¦' < $f)"; done
