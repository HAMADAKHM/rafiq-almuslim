# فحص يدوي لمصادر خارجية (لا ينشر شيئًا): يطبع ما يجده كملاحظات تُقرأ عبر واجهة GitHub
name: net-check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/net-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: makkahlive
        run: |
          for p in en/audio/morning-evening-adhkar audio/morning-evening-adhkar; do
            curl -sL -m 60 -A "Mozilla/5.0" "https://makkahlive.net/$p" -o ml.html
            echo "::notice::ML $p size=$(wc -c < ml.html)"
            grep -oE 'https?://[^"'"'"' <>]+\.(mp3|m4a)' ml.html | sort -u > links.txt
            grep -oE 'archive\.org/(details|download)/[^"'"'"' <>]+' ml.html | sort -u >> links.txt
            split -l 5 links.txt mlp_ 2>/dev/null; for f in mlp_*; do echo "::notice::MLL $(tr '\n' ' ' < $f)"; done; rm -f mlp_*
            grep -oE '"(title|name|reciter)"[^,]{0,120}' ml.html | head -40 | tr '\n' '|' | head -c 1800 | sed 's/^/::notice::MLT /'; echo
          done
      - name: archive-search
        run: |
          for q in 'أذكار الصباح' 'أذكار المساء' 'اذكار الصباح والمساء' 'athkar mishary' 'adhkar morning evening' 'azkar sabah' 'حصن المسلم صوت'; do
            curl -s -m 60 -G "https://archive.org/advancedsearch.php" --data-urlencode "q=($q) AND mediatype:audio" --data-urlencode "fl[]=identifier" --data-urlencode "fl[]=title" --data-urlencode "fl[]=creator" --data-urlencode "rows=25" --data-urlencode "output=json" -o s.json
            python3 -c "
          import json,sys
          d=json.load(open('s.json'))['response']['docs']
          out=' | '.join(f\"{x['identifier']}: {str(x.get('title',''))[:50]} [{str(x.get('creator',''))[:30]}]\" for x in d)
          print(out[:1900])
          " > o.txt 2>&1 || true
            echo "::notice::AS $q => $(cat o.txt)"
          done
