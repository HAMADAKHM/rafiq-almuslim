# فحص يدوي لمصادر خارجية (لا ينشر شيئًا): يطبع ما يجده كملاحظات تُقرأ عبر واجهة GitHub
name: net-check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/net-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: zip-method
        run: |
          python3 - <<'PY'
          import urllib.request,struct
          U='https://download.qurancomplex.gov.sa/new-sounds/TafseerMuyassar/TafseerMuyassar-ayat.zip'
          def rng(a,b):
              r=urllib.request.Request(U,headers={'Range':f'bytes={a}-{b}','User-Agent':'Mozilla/5.0'})
              x=urllib.request.urlopen(r,timeout=60); return x.status,x.headers.get('Content-Range'),x.headers.get('Access-Control-Allow-Origin'),x.read()
          st,cr,cors,cd=rng(742721293,742721293+4000)
          meth,=struct.unpack('<H',cd[10:12]); off,=struct.unpack('<I',cd[42:46]); fl,=struct.unpack('<H',cd[28:30])
          print(f'::notice::status={st} range={cr} cors={cors} method_first={meth} off={off} name={cd[46:46+fl].decode()}')
          ms=set();p=0
          while p+46<len(cd) and cd[p:p+4]==b'PK\x01\x02':
              ms.add(struct.unpack('<H',cd[p+10:p+12])[0]); fl,el,cl=struct.unpack('<HHH',cd[p+28:p+34]); p+=46+fl+el+cl
          print('::notice::methods',sorted(ms))
          PY
      - name: hisn-terms
        run: |
          for u in https://www.hisnmuslim.com/i/ar/about https://www.hisnmuslim.com/about https://www.hisnmuslim.com/api/ https://www.hisnmuslim.com/i/ar/; do
            code=$(curl -sL -m 20 -o p.html -w '%{http_code}' "$u")
            python3 - "$u" "$code" <<'PY'
          import re,html,sys
          x=html.unescape(re.sub(r'<[^>]+>',' ',open('p.html',encoding='utf-8',errors='ignore').read())); x=re.sub(r'\s+',' ',x)
          out=[]
          for w in ['حقوق','copyright','Copyright','©','ترخيص','license','مجان','قارئ','بصوت','قراءة']:
              i=x.find(w)
              if i>=0: out.append(w+'→'+x[max(0,i-90):i+140])
          print('::notice::'+sys.argv[1]+' '+sys.argv[2]+' '+(' ## '.join(out)[:700] if out else x[:300]).replace(':','،'))
          PY
          done
