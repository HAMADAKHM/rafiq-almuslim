# فحص يدوي لخوادم المساجد (لا ينشر شيئًا): يطبع حالة كل خادم بطلب حقيقي كما يرسله التطبيق
name: net-check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/net-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mosque data providers
        run: |
          UA='RafiqAlMuslim/1.0 (Islamic companion app; +https://github.com/HAMADAKHM/rafiq-almuslim)'
          Q='[out:json][timeout:25];(node["amenity"="place_of_worship"]["religion"="muslim"](around:3150,32.221,35.254);way["amenity"="place_of_worship"]["religion"="muslim"](around:3150,32.221,35.254););out center tags 120;'
          echo "::notice::photon -> $(curl -s -m 30 -A "$UA" -o p.json -w '%{http_code}' -w ' %{time_total}s' 'https://photon.komoot.io/api/?q=mosque&lat=32.221&lon=35.254&limit=20&osm_tag=amenity:place_of_worship') $(head -c 300 p.json | tr -d ':')"
          echo "::notice::nominatim -> $(curl -s -m 30 -A "$UA" -o n.json -w '%{http_code}' -w ' %{time_total}s' 'https://nominatim.openstreetmap.org/search?q=mosque&format=jsonv2&limit=40&viewbox=35.22,32.25,35.29,32.19&bounded=1') $(head -c 300 n.json | tr -d ':')"
          echo "::notice::nominatim-ar -> $(curl -s -m 30 -A "$UA" -o n2.json -w '%{http_code} %{time_total}s' 'https://nominatim.openstreetmap.org/search?q=%D9%85%D8%B3%D8%AC%D8%AF&format=jsonv2&limit=40&viewbox=35.22,32.25,35.29,32.19&bounded=1') count=$(grep -o place_id n2.json | wc -l)"
          echo "::notice::nominatim-en count=$(grep -o place_id n.json | wc -l) photon count=$(grep -o osm_id p.json | wc -l)"
          echo "::notice::overpass-small -> $(curl -s -m 60 -A "$UA" -o o.json -w '%{http_code} %{time_total}s' -G --data-urlencode 'data=[out:json][timeout:20];nwr["amenity"="place_of_worship"]["religion"="muslim"](around:2000,32.221,35.254);out center 60;' https://overpass-api.de/api/interpreter) count=$(grep -o '"type"' o.json | wc -l)"
