# فحص يدوي لمصادر خارجية (لا ينشر شيئًا): يطبع ما يجده كملاحظات تُقرأ عبر واجهة GitHub
name: net-check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/net-check.yml', 'scripts/hisn-audio-map.mjs']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts > /dev/null 2>&1 || npm install --ignore-scripts > /dev/null 2>&1
      - name: hisn-audio-map
        run: |
          npx --yes tsx scripts/hisn-audio-map.mjs > map.txt 2> err.txt || true
          echo "::notice::$(head -1 map.txt) err=$(head -c 300 err.txt | tr -d ':\n')"
          grep '^MAP ' map.txt | sed 's/^MAP //' | tr -d ':' | sed 's/"//g' | fold -w 900 | while read -r l; do echo "::notice::M $l"; done
          grep '^CAND ' map.txt | sed 's/^CAND //' | tr -d ':' | while read -r l; do echo "::notice::C $l"; done
          echo "::notice::NONE $(grep '^NONE ' map.txt | sed 's/^NONE //' | tr '\n' ' ')"
          grep '^REPORT ' map.txt | sed 's/^REPORT //' | tr ' ' '\n' | awk -F@ '$2<1' | tr '\n' ' ' | fold -w 900 | while read -r l; do echo "::notice::P $l"; done
