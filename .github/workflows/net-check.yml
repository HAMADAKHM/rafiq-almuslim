# فحص يدوي لمصادر خارجية (لا ينشر شيئًا): يطبع ما يجده كملاحظات تُقرأ عبر واجهة GitHub
name: net-check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/net-check.yml', 'scripts/hisn-audio-map.mjs']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts > /dev/null 2>&1 || npm install --ignore-scripts > /dev/null 2>&1
      - name: hisn-word-times
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
          pip install -q "av>=11,<13" faster-whisper > /dev/null 2>&1
          for n in 77 102 1 66 86; do curl -s -m 60 -o "h$n.mp3" "https://www.hisnmuslim.com/audio/ar/$n.mp3"; done
          python3 - <<'PY' > words.txt 2>err.txt || true
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          for n in [77, 102, 1, 66, 86]:
              segs, info = m.transcribe(f"h{n}.mp3", language="ar", beam_size=5, word_timestamps=True)
              out = []
              for s in segs:
                  for w in s.words:
                      out.append(f"{w.word.strip()}@{w.start:.2f}-{w.end:.2f}")
                  if sum(len(x) for x in out) > 1500: break
              print(f"W{n} " + " ".join(out))
          PY
          while read -r line; do echo "::notice::$(echo "$line" | head -c 1900)"; done < words.txt
          echo "::notice::ERR $(tail -c 300 err.txt | tr -d '\n:')"
      - name: hisn-audio-map
        run: |
          npx --yes tsx scripts/hisn-audio-map.mjs > map.txt 2> err.txt || true
          echo "::notice::$(grep '^SUM ' map.txt) err=$(head -c 200 err.txt | tr -d ':\n')"
          echo "::notice::$(grep '^MAP ' map.txt | tr -d ':\"')"
          echo "::notice::$(grep '^NONE ' map.txt)"
          grep '^REVIEW ' map.txt | sed 's/^REVIEW //' | tr -d ':' | sed 's/ ¦ /\n/g' > rev.txt
          split -l 6 rev.txt part_
          for f in part_*; do echo "::notice::R $(tr '\n' '¦' < $f)"; done
      - name: hisn-durations
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
          out=""
          for n in 12 79 77 86 96 98 106 216 1; do
            curl -s -m 30 -o a.mp3 "https://www.hisnmuslim.com/audio/ar/$n.mp3"
            d=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 a.mp3 2>/dev/null | cut -c1-5)
            out="$out #$n=${d}s"
          done
          echo "::notice::durations$out"
