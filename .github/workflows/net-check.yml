# فحص يدوي لخوادم المساجد (لا ينشر شيئًا): يطبع حالة كل خادم بطلب حقيقي كما يرسله التطبيق
name: net-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mosque data providers
        run: |
          UA='RafiqAlMuslim/1.0 (Islamic companion app; +https://github.com/HAMADAKHM/rafiq-almuslim)'
          Q='[out:json][timeout:25];(node["amenity"="place_of_worship"]["religion"="muslim"](around:3150,32.221,35.254);way["amenity"="place_of_worship"]["religion"="muslim"](around:3150,32.221,35.254););out center tags 120;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            for mode in get post; do
              if [ $mode = get ]; then
                out=$(curl -s -m 40 -A "$UA" -o body.json -w '%{http_code} %{time_total}s' -G --data-urlencode "data=$Q" "$ep" || echo "ERR")
              else
                out=$(curl -s -m 40 -A "$UA" -o body.json -w '%{http_code} %{time_total}s' --data-urlencode "data=$Q" "$ep" || echo "ERR")
              fi
              n=$(grep -o '"type"' body.json 2>/dev/null | wc -l)
              echo "$mode $ep -> $out elements=$n $(head -c 120 body.json | tr '\n' ' ')"
            done
            echo "ua-default $ep -> $(curl -s -m 40 -o /dev/null -w '%{http_code}' -A 'Dalvik/2.1.0 (Linux; U; Android 14)' -G --data-urlencode "data=$Q" "$ep")"
          done
          echo "photon -> $(curl -s -m 30 -A "$UA" -o p.json -w '%{http_code}' 'https://photon.komoot.io/api/?q=mosque&lat=32.221&lon=35.254&limit=20&osm_tag=amenity:place_of_worship') $(head -c 300 p.json)"
          echo "nominatim -> $(curl -s -m 30 -A "$UA" -o n.json -w '%{http_code}' 'https://nominatim.openstreetmap.org/search?amenity=place_of_worship&q=mosque&format=jsonv2&limit=20&viewbox=35.22,32.25,35.29,32.19&bounded=1') $(head -c 300 n.json)"
