apply plugin: 'com.android.application'

// رقم الإصدار من package.json (نفس رقم تطبيق الهاتف)
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))

android {
    // مفتاح توقيع ثابت للنسخ التجريبية: يحدده CI صراحة (المتغير RAFIQ_DEBUG_KEYSTORE)، حتى تُثبَّت كل نسخة
    // فوق السابقة. دون المتغير يبقى مفتاح التطوير الافتراضي للجهاز.
    signingConfigs {
        debug {
            def ks = System.getenv('RAFIQ_DEBUG_KEYSTORE')
            if (ks && new File(ks).exists()) {
                storeFile new File(ks)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    namespace 'org.rafiqalmuslim.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'org.rafiqalmuslim.tv.next'
        minSdk 21
        targetSdk 36
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName pkg.version
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    // org.json الحقيقي لاختبارات الوحدة (نسخة Android في الاختبارات المحلية فارغة)
    testImplementation 'org.json:json:20240303'
}

// واجهة الشاشة تُبنى بـ npm run build:tv ثم تُنسخ إلى الأصول قبل البناء
tasks.register('checkTvAssets') {
    doLast {
        if (!file('src/main/assets/tv/tv.html').exists()) throw new GradleException('شغّل أولًا: npm run build:tv && npm run tv:assets')
    }
}
preBuild.dependsOn 'checkTvAssets'
